name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      CORE_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
      - uses: actions/checkout@v4
      - name: Get core
        run: |
          git clone https://github.com/libretro/pcsx_rearmed core
          git -C core checkout "$CORE_COMMIT"
          git -C core submodule update --init --recursive
      - name: Build core
        run: make -C core -f Makefile.libretro platform=ctr -j2
      - name: Build app
        run: make
      - name: Show details
        run: |
          echo "=== where defined ==="
          grep -rn "ctr_get_mem_info\|ctr_svchack_successful\|__linear_heap_size\|__heap_size" core --include=*.c --include=*.h --include=*.S | head -40
          echo "=== symbols ==="
          $DEVKITARM/bin/arm-none-eabi-nm PSXctr.elf | grep -i -E "svchack|heap_size|stacksize|ctr_get_mem" || true
          echo "=== values ==="
          $DEVKITARM/bin/arm-none-eabi-objdump -s --start-address=0x1ebdd0 --stop-address=0x1ebde0 PSXctr.elf || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PSXctr
          path: PSXctr.3dsx
