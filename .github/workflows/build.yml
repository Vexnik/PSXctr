name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      CORE_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
      - uses: actions/checkout@v4
      - name: Get core
        run: |
          git clone https://github.com/libretro/pcsx_rearmed core
          git -C core checkout "$CORE_COMMIT"
          git -C core submodule update --init --recursive
      - name: Build core
        run: make -C core -f Makefile.libretro platform=ctr -j2
      - name: Build app
        run: make
      - name: Show function details
        run: |
          echo "=== uses ==="
          grep -n "log_mem_usage" core/frontend/libretro.c || true
          echo "=== source ==="
          grep -n -B2 -A28 "^static void log_mem_usage" core/frontend/libretro.c || true
          echo "=== machine code ==="
          $DEVKITARM/bin/arm-none-eabi-objdump -d --start-address=0x1ebcb0 --stop-address=0x1ebd00 PSXctr.elf || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PSXctr
          path: PSXctr.3dsx
