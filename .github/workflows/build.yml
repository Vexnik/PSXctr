name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      CORE_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
      - uses: actions/checkout@v4
      - name: Get core
        run: |
          git clone https://github.com/libretro/pcsx_rearmed core
          git -C core checkout "$CORE_COMMIT"
          git -C core submodule update --init --recursive
      - name: Build core
        run: make -C core -f Makefile.libretro platform=ctr -j2
      - name: Build app
        run: make
      - name: Show details
        run: |
          echo "=== Core memory helper ==="
          sed -n '610,635p' core/frontend/libretro.c
          echo "=== Symbol definitions ==="
          grep -rn "__ctr_svchax\|ctr_get_mem_info\|ctr_svchack\|__linear_heap_size\|__heap_size" core --include='*.c' --include='*.h' --include='*.S' | head -60
          echo "=== Linked symbols ==="
          $DEVKITARM/bin/arm-none-eabi-nm -a PSXctr.elf | grep -i -E 'svchax|svchack|heap_size|stacksize|ctr_get_mem|log_mem_usage' || true
          echo "=== Crash-site disassembly ==="
          $DEVKITARM/bin/arm-none-eabi-objdump -d PSXctr.elf --start-address=0x1ebca0 --stop-address=0x1ebd10 || true
          echo "=== Crash-site literal pool ==="
          $DEVKITARM/bin/arm-none-eabi-objdump -s --start-address=0x1ebdd0 --stop-address=0x1ebde0 PSXctr.elf || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PSXctr
          path: PSXctr.3dsx
