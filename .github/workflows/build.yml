name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      CORE_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
      - uses: actions/checkout@v4
      - name: Get core
        run: |
          git clone https://github.com/libretro/pcsx_rearmed core
          git -C core checkout "$CORE_COMMIT"
          git -C core submodule update --init --recursive
      - name: Build core
        run: make -C core -f Makefile.libretro platform=ctr -j2
      - name: Build app
        run: make
      - name: Show core platform code
        run: |
          echo "=== files ==="
          ls -la core/frontend/3ds
          for f in core/frontend/3ds/*; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          echo "=== uses of __ctr_svchax ==="
          grep -rn -C6 "__ctr_svchax" core --include=*.c --include=*.h | head -300
          echo "=== memory and cache helpers ==="
          grep -rn -C3 "ctr_flush_invalidate_cache\|pl_3ds_mmap\|pl_3ds_munmap" core --include=*.c --include=*.h | head -200
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PSXctr
          path: PSXctr.3dsx
